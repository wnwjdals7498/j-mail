# Deployment input only; not applied to an operational host by this task.
services:
  mailpit:
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    network_mode: host
    user: "${JML_MAILPIT_UID:?required}:${JML_MAILPIT_GID:?required}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: none
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    env_file: ["${JML_MAILPIT_ENV:?external generated profile required}"]
    volumes:
      - "${JML_MAILPIT_DATA_ROOT:?external data root}:/data"
